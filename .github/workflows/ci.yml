name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/*'

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retrieve version
        id: version
        run: |
          version=`awk -F "=" '$1 == "releaseName" {print $2}' gradle.properties`
          count=`git rev-list --count HEAD`
          echo "version=$version-$count" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.label }}
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64-v8a
            abis: arm64-v8a
            suffix: arm64-v8a
          - label: armeabi-v7a
            abis: armeabi-v7a
            suffix: armv7a
          - label: uni
            abis: arm64-v8a,armeabi-v7a, x86_64
            suffix: uni
          - label: x86_64
            abis: x86_64
            suffix: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          cmdline-tools-version: 14742923
          packages: ''

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK 37
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37.0"
          sdkmanager "build-tools;37.0.0"

      - name: Restore release keystore
        env:
          KEY_STORE: ${{ secrets.KEY_STORE || secrets.BBZQ_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.BBZQ_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS || secrets.BBZQ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.BBZQ_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_STORE" ]; then
            mkdir -p signing
            printf '%s' "$KEY_STORE" | base64 -d > signing/bbzq-key.p12
            cat <<EOF > signing.properties
          KEYSTORE_PASSWORD=$KEY_STORE_PASSWORD
          KEYSTORE_ALIAS=$ALIAS
          KEYSTORE_ALIAS_PASSWORD=${KEY_PASSWORD:-$KEY_STORE_PASSWORD}
          KEYSTORE_FILE=signing/bbzq-key.p12
          EOF
          fi

      - name: Export signing env
        env:
          RELEASE_STORE_FILE: signing/bbzq-key.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.BBZQ_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.BBZQ_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.BBZQ_KEY_PASSWORD }}
        run: |
          {
            echo "RELEASE_STORE_FILE=$RELEASE_STORE_FILE"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Restore linker guard source
        env:
          LINKER_GUARD_SOURCE_B64: ${{ secrets.LINKER_GUARD_SOURCE_B64 }}
        run: |
          if [ -n "$LINKER_GUARD_SOURCE_B64" ]; then
            printf '%s' "$LINKER_GUARD_SOURCE_B64" | base64 -d > app/src/main/java/io/github/bbzq/LinkerGuard.kt
          fi

      - name: Build with gradle
        run: |
          chmod 777 ./gradlew
          tasks="assembleRelease"
          if [ "${{ matrix.label }}" = "uni" ]; then
            tasks="assembleDebug $tasks"
          fi
          ./gradlew --no-daemon --build-cache -PbbzqAbiFilters="${{ matrix.abis }}" -PbbzqOutputSuffix="${{ matrix.suffix }}" $tasks

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        if: success() && matrix.label == 'uni'
        with:
          name: bbzq-${{ env.VERSION }}-${{ matrix.label }}-debug
          path: 'app/build/outputs/apk/debug/*.apk'

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bbzq-${{ env.VERSION }}-${{ matrix.label }}-release
          path: 'app/release/*.apk'

  publish:
    name: Publish to Telegram
    needs: [version, build]
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Send APKs to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          TITLE: BBZQ
          VERSION: ${{ needs.version.outputs.version }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not configured, skipping upload"
            exit 0
          fi

          # Collect release APKs excluding debug and uni
          APK_FILES=()
          while IFS= read -r -d '' file; do
            APK_FILES+=("$file")
          done < <(find artifacts -type f -name '*.apk' ! -name '*debug*' ! -name '*-uni.apk' -print0 | sort -z)

          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "::warning::No specific ABI release APK found, checking fallback..."
            while IFS= read -r -d '' file; do
              APK_FILES+=("$file")
            done < <(find artifacts -type f -name '*.apk' ! -name '*debug*' -print0 | sort -z)
          fi

          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "::error::No APK files found to publish"
            exit 1
          fi

          COMMIT_MESSAGE=$(git log -1 --pretty=%B 2>/dev/null || echo "No commit message")
          PRIMARY_AUTHOR=$(git log -1 --pretty=%an 2>/dev/null || echo "Unknown")

          escape_html() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          trim_caption_message() {
            local text="$1"
            local limit="$2"

            if [ "$limit" -le 0 ]; then
              printf ''
              return
            fi

            if [ "${#text}" -le "$limit" ]; then
              printf '%s' "$text"
              return
            fi

            if [ "$limit" -le 3 ]; then
              printf '%.*s' "$limit" '...'
              return
            fi

            printf '%s...' "${text:0:$((limit - 3))}"
          }

          SAFE_TITLE=$(printf '%s' "$TITLE" | escape_html)
          SAFE_BRANCH=$(printf '%s' "$BRANCH" | escape_html)
          SAFE_PRIMARY_AUTHOR=$(printf '%s' "$PRIMARY_AUTHOR" | escape_html)
          SAFE_MESSAGE=$(printf '%s' "$COMMIT_MESSAGE" | sed -e 's/\r//g' | escape_html)

          NL=$'\n'
          CAPTION_PREFIX="<b>${SAFE_TITLE}</b> ${VERSION}${NL}"
          CAPTION_PREFIX+="Author: ${SAFE_PRIMARY_AUTHOR}${NL}"
          CAPTION_PREFIX+="Branch: ${SAFE_BRANCH}${NL}${NL}"
          CAPTION_SUFFIX="${NL}${NL}<a href=\"${COMMIT_URL}\">Commit</a> | <a href=\"${RUN_URL}\">Workflow run</a>"

          MAX_CAPTION_LENGTH=1024
          MESSAGE_WRAPPER_LENGTH=24
          AVAILABLE_MESSAGE_LENGTH=$((MAX_CAPTION_LENGTH - ${#CAPTION_PREFIX} - ${#CAPTION_SUFFIX} - MESSAGE_WRAPPER_LENGTH))
          SAFE_MESSAGE=$(trim_caption_message "$SAFE_MESSAGE" "$AVAILABLE_MESSAGE_LENGTH")
          CAPTION="${CAPTION_PREFIX}<blockquote>${SAFE_MESSAGE}</blockquote>${CAPTION_SUFFIX}"

          # Construct media group JSON and curl form parameters
          # Telegram sendMediaGroup allows 2-10 items of the same type (document)
          MEDIA_JSON="["
          CURL_FORM_ARGS=()

          for i in "${!APK_FILES[@]}"; do
            apk="${APK_FILES[$i]}"
            file_key="doc${i}"
            CURL_FORM_ARGS+=( -F "${file_key}=@${apk}" )

            if [ "$i" -gt 0 ]; then
              MEDIA_JSON+=","
            fi

            # Escape caption for json
            ESCAPED_CAPTION=$(python3 -c "import json, sys; print(json.dumps(sys.argv[1]))" "$CAPTION")

            if [ "$i" -eq 0 ]; then
              MEDIA_JSON+="{\"type\":\"document\",\"media\":\"attach://${file_key}\",\"caption\":${ESCAPED_CAPTION},\"parse_mode\":\"HTML\"}"
            else
              MEDIA_JSON+="{\"type\":\"document\",\"media\":\"attach://${file_key}\"}"
            fi
          done
          MEDIA_JSON+="]"

          CURL_ARGS=(
            --silent --show-error --fail
            --request POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMediaGroup"
            -F "chat_id=${TG_CHAT_ID}"
            -F "media=${MEDIA_JSON}"
            "${CURL_FORM_ARGS[@]}"
          )

          if [ -n "${TG_THREAD_ID:-}" ]; then
            CURL_ARGS+=(-F "message_thread_id=${TG_THREAD_ID}")
          fi

          echo "Uploading ${#APK_FILES[@]} APK(s) to Telegram as a media group..."
          for apk in "${APK_FILES[@]}"; do
            echo "  - $(basename "$apk")"
          done

          curl "${CURL_ARGS[@]}" >/dev/null
          echo "Media group uploaded to Telegram successfully."
