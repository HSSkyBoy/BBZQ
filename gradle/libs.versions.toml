[versions]
kotlin = "2.4.21"
agp = "9.5.2"
libxposedApi = "102.0.0"
libxposedService = "102.0.0"
libxposedInterface = "102.0.0"
junit = "4.13.2"
json = "20260814"
okhttp = "5.3.2"
dexkit = "2.2.0"
shizukuApi = "13.1.5"
shizukuProvider = "13.1.5"
npatchRemoteApi = "v1.0.1"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version.ref = "libxposedApi" }
libxposed-service = { module = "io.github.libxposed:service", version.ref = "libxposedService" }
libxposed-aidl = { module = "io.github.libxposed:interface", version.ref = "libxposedInterface" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
dexkit = { group = "org.luckypray", name = "dexkit", version.ref = "dexkit" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizukuApi" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizukuProvider" }
npatch-remote-api = { module = "com.github.7723mod:NPatch-Remote-API", version.ref = "npatchRemoteApi" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
